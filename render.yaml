services:
  - type: web
    name: cardiopredict-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false   # Set this manually in the Render dashboard to your Vercel URL
      - key: PORT
        generateValue: false
    healthCheckPath: /health
    autoDeploy: true
